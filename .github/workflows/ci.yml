name: NARA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check app.js && node --check sw.js
      - name: Conversational smoke tests
        run: node tests/smoke.mjs
      - name: Contextual conversation tests
        run: node tests/conversation.mjs
      - name: Optional AI backend validation
        run: node tests/ai-worker.mjs
      - name: First-run UI contract
        run: node tests/ui-contract.mjs
      - name: Navigation and FAB behavior
        run: node tests/navigation-fab.mjs
      - name: Required files
        run: |
          test -f index.html
          test -f styles.css
          test -f manifest.webmanifest
          test -f icon.svg
